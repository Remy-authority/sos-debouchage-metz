name: Publier un article (autoblog)

# Publie automatiquement chaque jour le plus ancien article conforme de content/drafts/.
# Le push sur main déclenche le redéploiement Vercel. Cadence portée de 3 à 5 par semaine
# le 20/09/2026, puis à 7 par semaine le 05/11/2026 (décisions Rémy).
#
# Fuseau : cron GitHub = UTC. On tire à 05:17 UTC toute l'année (~7h17 à Paris en été,
# ~6h17 en hiver). L'heure exacte n'est pas critique, on ne gère donc pas le DST.

on:
  schedule:
    - cron: '17 5 * * *' # 7 articles par semaine, Rémy 05/11/2026 (chaque jour à 05:17 UTC ; minute décalée le 29/08/2026 : GitHub saute les crons à l'heure pile)
  workflow_dispatch: {} # déclenchement manuel (test immédiat, sans attendre le lendemain)

# Le GITHUB_TOKEN doit pouvoir committer/pusher sur main.
permissions:
  contents: write

# Jamais deux publications simultanées (ex. cron + déclenchement manuel).
concurrency:
  group: publish-article
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # Avant la publication : le contrôle des brouillons (verifier-brouillon.mjs) lit gray-matter.
      - name: Installer les dependances
        run: npm ci --no-audit --no-fund

      - name: Publier le plus ancien draft conforme
        id: pub
        run: node scripts/publish-next-draft.mjs

      # Genere la couverture manquante et le visuel de corps de l'article qui vient d'etre
      # publie (recette RENT & RANK/docs/RECETTE-VISUELS-ARTICLES.md). Si la generation
      # echoue, cette etape sort en erreur : l'etape de commit ci-dessous ne s'execute pas,
      # main reste intact et le brouillon repart au prochain passage. Aucun article ne se
      # publie sans ses images.
      - name: Generer les visuels de l'article
        if: steps.pub.outputs.published == 'true'
        env:
          IMAGE_PROVIDER: flux
          FAL_KEY: ${{ secrets.FAL_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: node scripts/generate-article-images.mjs "${{ steps.pub.outputs.slug }}"

      - name: Commit & push sur main
        if: steps.pub.outputs.published == 'true'
        run: |
          git config user.name "autoblog-bot"
          git config user.email "autoblog-bot@users.noreply.github.com"
          git add content public
          git commit -m "content(autoblog): publication de ${{ steps.pub.outputs.slug }}"
          git push origin main

      - name: Rien à publier
        if: steps.pub.outputs.published != 'true'
        run: echo "Aucun draft en attente dans content/drafts/. Workflow terminé sans publication."
